name: Deploy - Update Project Deploy Status

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
        description: "PR number associated with the deployment"
      environment:
        required: true
        type: string
        description: "Deployment environment: dev, uat, or prod"
      status:
        required: true
        type: string
        description: "Deploy status: waiting, deploying, deployed, or failed"
    secrets:
      PAT_TOKEN:
        required: true

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: number
        description: "PR number"
      environment:
        required: true
        type: choice
        options: [dev, uat, prod]
      status:
        required: true
        type: choice
        options: [waiting, deploying, deployed, failed]

jobs:
  update-deploy-status:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      PROJECT_ID: ${{ vars.WORKFLOW_PROJECT_ID }}
      PR_NUMBER: ${{ inputs.pr_number }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_STATUS: ${{ inputs.status }}
      # Field IDs per environment
      DEPLOY_DEV_FIELD_ID: ${{ vars.WORKFLOW_DEPLOY_DEV_FIELD_ID }}
      DEPLOY_UAT_FIELD_ID: ${{ vars.WORKFLOW_DEPLOY_UAT_FIELD_ID }}
      DEPLOY_PROD_FIELD_ID: ${{ vars.WORKFLOW_DEPLOY_PROD_FIELD_ID }}
      # Option IDs per environment (each deploy field has its own option IDs)
      DEPLOY_DEV_WAITING_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_DEV_WAITING_OPTION_ID }}
      DEPLOY_DEV_DEPLOYING_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_DEV_DEPLOYING_OPTION_ID }}
      DEPLOY_DEV_DEPLOYED_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_DEV_DEPLOYED_OPTION_ID }}
      DEPLOY_DEV_FAILED_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_DEV_FAILED_OPTION_ID }}
      DEPLOY_UAT_WAITING_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_UAT_WAITING_OPTION_ID }}
      DEPLOY_UAT_DEPLOYING_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_UAT_DEPLOYING_OPTION_ID }}
      DEPLOY_UAT_DEPLOYED_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_UAT_DEPLOYED_OPTION_ID }}
      DEPLOY_UAT_FAILED_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_UAT_FAILED_OPTION_ID }}
      DEPLOY_PROD_WAITING_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_PROD_WAITING_OPTION_ID }}
      DEPLOY_PROD_DEPLOYING_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_PROD_DEPLOYING_OPTION_ID }}
      DEPLOY_PROD_DEPLOYED_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_PROD_DEPLOYED_OPTION_ID }}
      DEPLOY_PROD_FAILED_OPTION_ID: ${{ vars.WORKFLOW_DEPLOY_PROD_FAILED_OPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Update deploy status in Project V2
        run: bash .github/scripts/update-deploy-status.sh
