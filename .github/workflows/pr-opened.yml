name: PR Opened

on:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Update Project Status to Code Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const PROJECT_ID      = process.env.PROJECT_ID;
            const STATUS_FIELD_ID = process.env.STATUS_FIELD_ID;
            const CODE_REVIEW_OPTION_ID = process.env.CODE_REVIEW_OPTION_ID;

            if (!PROJECT_ID || !STATUS_FIELD_ID || !CODE_REVIEW_OPTION_ID) {
              core.setFailed("Missing required environment variables: PROJECT_ID, STATUS_FIELD_ID, CODE_REVIEW_OPTION_ID");
              return;
            }

            const pr = context.payload.pull_request;

            // ดึง linked issues ทั้งหมดจาก PR (รองรับ multi-issue)
            const linkedIssuesQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 20) {
                      nodes {
                        id
                        number
                      }
                    }
                  }
                }
              }
            `;

            const linkedResult = await github.graphql(linkedIssuesQuery, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number
            });

            const linkedIssues =
              linkedResult.repository.pullRequest.closingIssuesReferences.nodes;

            if (!linkedIssues || linkedIssues.length === 0) {
              console.log("No linked issues found — skipping status update");
              return;
            }

            console.log(`Found ${linkedIssues.length} linked issue(s):`, linkedIssues.map(i => `#${i.number}`).join(", "));

            // ดึง project items ทั้งหมด (pagination-safe สำหรับ project ที่มี items ไม่เกิน 100)
            const projectItemsQuery = `
              query($project: ID!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectResult = await github.graphql(projectItemsQuery, {
              project: PROJECT_ID
            });

            const projectItems = projectResult.node.items.nodes;

            // helper: update status ของ project item เดียว
            const updateStatusMutation = `
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $project
                    itemId: $item
                    fieldId: $field
                    value: { singleSelectOptionId: $option }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            // loop ทุก linked issue
            let updatedCount = 0;
            let skippedCount = 0;

            for (const issue of linkedIssues) {
              const projectItem = projectItems.find(
                i => i.content && i.content.id === issue.id
              );

              if (!projectItem) {
                console.warn(`Issue #${issue.number} not found in project — skipping`);
                skippedCount++;
                continue;
              }

              await github.graphql(updateStatusMutation, {
                project: PROJECT_ID,
                item: projectItem.id,
                field: STATUS_FIELD_ID,
                option: CODE_REVIEW_OPTION_ID
              });

              console.log(`✓ Issue #${issue.number} → Code Review`);
              updatedCount++;
            }

            console.log(`Done: ${updatedCount} updated, ${skippedCount} skipped`);
        env:
          PROJECT_ID: ${{ vars.WORKFLOW_PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.WORKFLOW_STATUS_FIELD_ID }}
          CODE_REVIEW_OPTION_ID: ${{ vars.WORKFLOW_CODE_REVIEW_OPTION_ID }}
