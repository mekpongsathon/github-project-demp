name: PR Opened

on:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Update Project Status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const PROJECT_ID = "PVT_kwHOApQkuM4BXcog";
            const STATUS_FIELD_ID = "PVTSSF_lAHOApQkuM4BXcogzhSpamg";
            const IN_PROGRESS_OPTION_ID = "47fc9ee4";

            const pr = context.payload.pull_request;

            // หา issue ที่ linked กับ PR
            const query = `
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first:1) {
                      nodes {
                        id
                        number
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number
            });

            const issue =
              result.repository.pullRequest.closingIssuesReferences.nodes[0];

            if (!issue) {
              core.setFailed("No linked issue found");
              return;
            }

            console.log("Issue:", issue.number);

            // หา project item id
            const itemQuery = `
              query($project:ID!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const itemResult = await github.graphql(itemQuery, {
              project: PROJECT_ID,
              issue: issue.id
            });

            const item = itemResult.node.items.nodes.find(
              i => i.content && i.content.id === issue.id
            );

            if (!item) {
              core.setFailed("Project item not found");
              return;
            }

            console.log("Project Item:", item.id);

            // update status
            const mutation = `
              mutation(
                $project:ID!,
                $item:ID!,
                $field:ID!,
                $option:String!
              ) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId:$project
                    itemId:$item
                    fieldId:$field
                    value:{
                      singleSelectOptionId:$option
                    }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            await github.graphql(mutation, {
              project: PROJECT_ID,
              item: item.id,
              field: STATUS_FIELD_ID,
              option: IN_PROGRESS_OPTION_ID
            });

            console.log("Status updated to In Progress");